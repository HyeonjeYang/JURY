[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jury"
version = "0.1.0"
description = "Verify Sanger reads against a plasmid map - VERIFIED, MISMATCH, or the jury is still out"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["biopython>=1.80"]

[project.optional-dependencies]
progress = ["tqdm>=4.60"]
dev = ["pytest>=7"]

[project.scripts]
jury = "jury.cli:main"

[project.urls]
Repository = "https://github.com/HyeonjeYang/JURY"

[tool.setuptools.packages.find]
include = ["jury*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
